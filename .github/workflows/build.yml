# =============================================================================
# DockFlow-Automator - continuous integration.
#
# Jobs:
#   lint      - ruff over the whole repository
#   test      - offline pytest matrix: Linux / macOS / Windows x Python 3.10 & 3.12
#   gui       - PyQt6 offscreen GUI smoke tests (all three OS)
#   bindings  - C++ accelerator wheels via cibuildwheel (all three OS)
#   docker    - build the pinned reproducibility image (Linux only)
#   release   - on v* tags: sdist + wheels + C++ wheels uploaded to the release
# =============================================================================
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # -------------------------------------------------------------------------
  # Lint
  # -------------------------------------------------------------------------
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install "ruff>=0.4"

      - name: Run ruff
        run: ruff check .

      - name: Ruff format check (non-blocking report)
        run: ruff format --check . || true

  # -------------------------------------------------------------------------
  # Offline test matrix: 3 operating systems x 2 Python versions
  # -------------------------------------------------------------------------
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install package + test/prep extras
        shell: bash
        run: python -m pip install -e ".[test,prep,viz]"

      - name: Environment report
        shell: bash
        run: python -m dockflow_core.cli info || true

      - name: Offline test suite
        shell: bash
        run: python -m pytest -m "not network and not gui" --cov=dockflow_core --cov-report=term

  # -------------------------------------------------------------------------
  # GUI smoke tests (offscreen Qt, no display needed)
  # -------------------------------------------------------------------------
  gui:
    name: gui smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
              libdbus-1-3 libfontconfig1 libglib2.0-0

      - name: Install package + GUI extras
        shell: bash
        run: python -m pip install -e ".[test,gui,viz]"

      - name: GUI smoke tests (offscreen)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -m gui

  # -------------------------------------------------------------------------
  # C++ accelerator wheels (cibuildwheel: Linux / macOS / Windows)
  # -------------------------------------------------------------------------
  bindings:
    name: C++ wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.23.3
        with:
          package-dir: bindings
          output-dir: wheelhouse
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-*"
          # musllinux and 32-bit targets are not worth the CI minutes here
          CIBW_SKIP: "*-musllinux_* cp310-win32 cp311-win32 cp312-win32"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          # minimal import check per wheel
          CIBW_TEST_COMMAND: python -c "import dockflow_bindings as b; assert callable(b.kabsch_rmsd)"

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bindings-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          retention-days: 14

  # -------------------------------------------------------------------------
  # Docker image (Linux)
  # -------------------------------------------------------------------------
  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -f docker/Dockerfile -t dockflow-automator:ci .

      - name: Smoke test the image
        run: |
          docker run --rm dockflow-automator:ci info
          docker run --rm dockflow-automator:ci --help || true

  # -------------------------------------------------------------------------
  # Release: sdist + pure-python wheel + C++ wheels, on v* tags
  # -------------------------------------------------------------------------
  release:
    name: release (sdist + wheels)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, bindings]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download C++ binding wheels
        uses: actions/download-artifact@v4
        with:
          pattern: bindings-wheels-*
          path: dist
          merge-multiple: true

      - name: Build sdist + wheel
        run: |
          python -m pip install build
          python -m build

      - name: List artifacts
        run: ls -la dist/

      - name: Upload to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
