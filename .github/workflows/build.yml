# =============================================================================
# DockFlow-Automator - continuous integration.
#
# Jobs:
#   lint      - ruff over the whole repository
#   test      - offline pytest matrix: Linux / macOS / Windows x Python 3.10 & 3.12
#   gui       - PyQt6 offscreen GUI smoke tests (all three OS)
#   bindings  - C++ accelerator wheels via cibuildwheel (all three OS)
#   bindings-equivalence - C++/NumPy numeric delta, published as artifact
#   docker    - build the pinned reproducibility image (Linux only)
# (scientific validation and seed-determinism live in reproducibility.yml)
#   release   - on v* tags: sdist + wheels + C++ wheels uploaded to the release
# =============================================================================
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # -------------------------------------------------------------------------
  # Lint
  # -------------------------------------------------------------------------
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install "ruff>=0.4"

      - name: Run ruff
        run: ruff check .

      - name: Ruff format check (non-blocking report)
        run: ruff format --check . || true

  # -------------------------------------------------------------------------
  # Offline test matrix: 3 operating systems x 2 Python versions
  # -------------------------------------------------------------------------
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install package + test/prep extras
        shell: bash
        run: python -m pip install -e ".[test,prep,viz]"

      - name: Environment report
        shell: bash
        run: python -m dockflow_core.cli info || true

      - name: Offline software test suite (unit; no real docking)
        shell: bash
        run: python -m pytest -m "not network and not gui and not scientific" --cov=dockflow_core --cov-report=term

      - name: interactions.json schema conformance (item 21)
        shell: bash
        run: python -m pytest tests/test_schema.py -q

  # -------------------------------------------------------------------------
  # GUI smoke tests (offscreen Qt, no display needed)
  # -------------------------------------------------------------------------
  gui:
    name: gui smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
              libdbus-1-3 libfontconfig1 libglib2.0-0

      - name: Install package + GUI extras
        shell: bash
        run: python -m pip install -e ".[test,gui,viz]"

      - name: GUI smoke tests (offscreen)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -m gui

  # -------------------------------------------------------------------------
  # C++ accelerator wheels (cibuildwheel: Linux / macOS / Windows)
  # -------------------------------------------------------------------------
  bindings:
    name: C++ wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.1.2
        with:
          package-dir: bindings
          output-dir: wheelhouse
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-*"
          # musllinux and 32-bit targets are not worth the CI minutes here
          CIBW_SKIP: "*-musllinux_* cp310-win32 cp311-win32 cp312-win32"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          # minimal import check per wheel
          CIBW_TEST_COMMAND: python -c "import dockflow_bindings as b; assert callable(b.kabsch_rmsd)"

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bindings-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          retention-days: 14

  # -------------------------------------------------------------------------
  # C++/NumPy equivalence: build the accelerator, run the equivalence
  # tests and publish the numeric delta as an artifact (audit item 35).
  # -------------------------------------------------------------------------
  bindings-equivalence:
    name: C++ vs NumPy equivalence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package, tests and build the C++ accelerator
        run: |
          python -m pip install -e ".[test]"
          python -m pip install ./bindings

      - name: Equivalence test suite (tests/test_bindings.py)
        run: python -m pytest tests/test_bindings.py -v

      - name: Analyzer dual-path Kabsch tests (bindings + numpy fallback)
        # test_kabsch_rmsd_matches_bindings_both_paths is skipped in the plain
        # matrix (no compiled accelerator there) - this is the job that owns it
        run: >-
          python -m pytest tests/test_analyzer.py
          -k "kabsch or cluster" -v

      - name: Randomised delta report (scripts/bindings_equivalence.py)
        run: python scripts/bindings_equivalence.py --out bindings_deltas.json

      - name: Publish C++ vs NumPy delta artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bindings-numpy-deltas
          path: bindings_deltas.json
          retention-days: 30

  # -------------------------------------------------------------------------
  # Docker image (Linux)
  # -------------------------------------------------------------------------
  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the image
        run: docker build -f docker/Dockerfile -t dockflow-automator:ci .

      - name: Smoke test the image
        run: |
          docker run --rm dockflow-automator:ci info
          docker run --rm dockflow-automator:ci --help >/dev/null
          docker run --rm dockflow-automator:ci shell -c "command -v vina" >/dev/null
          docker run --rm dockflow-automator:ci shell -c "python -c 'import meeko, openbabel; print(\"prep stack OK\")'"

  # -------------------------------------------------------------------------
  # Release: sdist + pure-python wheel + C++ wheels, on v* tags
  # -------------------------------------------------------------------------
  release:
    name: release (sdist + wheels)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, bindings]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download C++ binding wheels
        uses: actions/download-artifact@v7
        with:
          pattern: bindings-wheels-*
          path: dist
          merge-multiple: true

      - name: Build sdist + wheel
        run: |
          python -m pip install build
          python -m build

      - name: List artifacts
        run: ls -la dist/

      - name: Upload to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
