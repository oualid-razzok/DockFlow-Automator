# =============================================================================
# DockFlow-Automator - NIGHTLY scientific validation.
#
# Work-order item 28: slow, real-science benchmarks do NOT belong in the
# per-PR path.  This workflow runs them on a schedule (and on demand):
#
#   1. redocking-benchmark : the full 24-complex suite (item 1)
#   2. enrichment          : DUD-E hivpr actives/decoys panel (item 3)
#   3. mgltools-comparison : DockFlow vs MGLTools 1.5.7 arms (item 2,
#                            bioconda mgltools with bundled python2)
#
# PR-level CI (build.yml) stays fast: offline unit tests + schema checks
# + GUI smoke + the 1HVR reproducibility pair (reproducibility.yml).
# =============================================================================
name: nightly

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  redocking-benchmark:
    name: 24-complex redocking benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the published benchmark environment (pinned)
        # Regeneration asserts the PUBLISHED numbers, so the environment must
        # match the one they were produced with (see
        # benchmarks/redocking/results/1HVR_benchmark/environment.json):
        # openbabel 3.1.1.23 receptor prep + rdkit 2025.9.6 analysis +
        # pandas 2.2.3 + numpy 2.5.3.  Unpinned installs resolve to
        # rdkit 2026.x / pandas 3.x on runners, which changes the prepared
        # PDBQTs and therefore the numbers (and the `engine` column).
        # The `engine` extra (vina python bindings) is deliberately NOT
        # installed: the workers dock through the official vina 1.2.7 CLI
        # binary set up in the next-but-one step instead.
        run: |
          python -m pip install -e ".[prep,obabel,viz,test]" \
            "numpy==2.5.3" "pandas==2.2.3" "rdkit==2025.9.6" \
            "meeko==0.8.0" "gemmi==0.7.5" "openbabel-wheel==3.1.1.23"

      - name: Environment fingerprint
        run: python -m dockflow_core.cli info

      - name: Install the official AutoDock Vina 1.2.7 CLI binary
        # A static, self-contained executable straight from the upstream
        # release: no system-library drift can break it.  Verified to be
        # bit-identical to the vina python bindings for identical inputs,
        # seed and thread count (same libvina C++ core), so the regenerated
        # numbers match the published (python-backend) numbers exactly.
        run: |
          curl -sL --retry 3 -o /usr/local/bin/vina \
            "https://github.com/ccsb-scripps/AutoDock-Vina/releases/download/v1.2.7/vina_1.2.7_linux_x86_64"
          chmod +x /usr/local/bin/vina
          vina --version
          vina --version | grep -q "v1.2.7"

      - name: Worker smoke (one complex, output passthrough)
        # Runs a single benchmark worker in the foreground so its full log
        # lands in the job log.  If the scientific stack is broken on the
        # runner, this pinpoints WHERE before the 90-minute full run.
        run: |
          python benchmarks/redocking/run_benchmark.py --out /tmp/worker-smoke \
            --worker 1STP --exhaustiveness 8 --seed 2026 --cpu 2

      - name: Regenerate the benchmark and ASSERT it matches the published numbers (item 14)
        run: |
          python benchmarks/redocking/regenerate.py --with-crosscheck

      - name: Assert the suite completed (no complex dropped)
        run: |
          python - << 'EOF'
          import json
          stats = json.load(open("benchmarks/redocking/results-regen/summary_stats.json"))
          assert stats["complexes_attempted"] == 24, stats
          assert stats["completed"] == 24, stats
          print("redocking:", stats)
          EOF

      - name: "Enrichment reproduce assertion (item 10 - metrics match within 1e-6)"
        run: |
          python benchmarks/enrichment/run_enrichment.py --report-only --target hivpr

      - name: Upload regenerated benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: redocking-benchmark
          # The REGENERATED artifacts (the committed copies under results/
          # are the publication itself, not evidence of this run).
          path: |
            benchmarks/redocking/results-regen/redocking_results.csv
            benchmarks/redocking/results-regen/summary.md
            benchmarks/redocking/results-regen/summary_stats.json
            benchmarks/redocking/results-regen/scatter.png
            benchmarks/redocking/results-regen/rmsd_distribution.png
            benchmarks/redocking/results-regen/topn_success.png
            benchmarks/redocking/results-regen/rmsd_crosscheck.png
            benchmarks/redocking/results-regen/crosscheck_stats.json
            benchmarks/redocking/results-regen/worker_failures.log
          if-no-files-found: warn
          retention-days: 90

  enrichment:
    name: DUD-E enrichment panel (hivpr)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install full scientific stack
        run: python -m pip install -e ".[prep,engine,viz,test]"

      - name: Dock the 3-target panel and compute enrichment metrics
        run: |
          python benchmarks/enrichment/run_enrichment.py --target hivpr --max-seconds 2400
          python benchmarks/enrichment/run_enrichment.py --target aa2ar --max-seconds 2400
          python benchmarks/enrichment/run_enrichment.py --target parp1 --max-seconds 2400

      - name: Assert metrics are above the random baseline
        run: |
          python - << 'EOF'
          import json
          for target in ("hivpr", "aa2ar", "parp1"):
              m = json.load(open(f"benchmarks/enrichment/results/{target}/enrichment_metrics.json"))
              assert m["roc_auc"] > 0.5, (target, m)  # chance ranking would be a failure
              print(target, m["roc_auc"])
          EOF

      - name: Upload enrichment results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: enrichment-benchmark
          path: |
            benchmarks/enrichment/results/hivpr/enrichment_metrics.json
            benchmarks/enrichment/results/hivpr/enrichment_results.csv
            benchmarks/enrichment/results/hivpr/roc.png
            benchmarks/enrichment/results/hivpr/summary.md
            benchmarks/enrichment/results/aa2ar/enrichment_metrics.json
            benchmarks/enrichment/results/aa2ar/summary.md
            benchmarks/enrichment/results/parp1/enrichment_metrics.json
            benchmarks/enrichment/results/parp1/summary.md
            benchmarks/enrichment/results/summary.md
          retention-days: 90

  mgltools-comparison:
    name: DockFlow vs MGLTools (subset)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install full scientific stack
        run: python -m pip install -e ".[prep,engine,viz,test]"

      - name: Fetch the redocking benchmark artifacts (DockFlow arm inputs)
        run: |
          python benchmarks/redocking/run_benchmark.py --limit 8 \
            --exhaustiveness 8 --max-seconds 3000

      - name: Set up MGLTools 1.5.7 (bioconda, bundled python2)
        run: |
          curl -sL --retry 3 -o /tmp/mgltools.tar.bz2 \
            "https://api.anaconda.org/download/bioconda/mgltools/1.5.7/linux-64/mgltools-1.5.7-0.tar.bz2"
          mkdir -p "$HOME/mgltools" \
            && tar xjf /tmp/mgltools.tar.bz2 -C "$HOME/mgltools" \
            --strip-components=0
          python scripts/fix_mgltools_prefix.py \
            --root "$HOME/mgltools" || true
          "$HOME/mgltools/bin/python2.7" --version

      - name: Run the comparison (first 8 complexes, both arms)
        run: |
          python benchmarks/mgltools_comparison/compare_workflow.py \
            --mgltools "$HOME/mgltools" --limit 8 --max-seconds 6000

      - name: Upload comparison results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mgltools-comparison
          path: |
            benchmarks/mgltools_comparison/results/comparison.csv
            benchmarks/mgltools_comparison/results/summary.md
            benchmarks/mgltools_comparison/results/comparison_stats.json
            benchmarks/mgltools_comparison/results/failures/
          retention-days: 90
