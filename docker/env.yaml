name: dockflow
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - pip
  - numpy
  - pyyaml
  - requests
  - pandas
  # chemistry toolkits (heavy, not always pip-installable)
  - openbabel
  - pymol-open-source
  # docking engine (CLI executable)
  - autodock-vina
  # build deps for the vina python bindings and our C++ module
  - swig
  - cmake
  - ninja
  # NOTE: the application itself is pip-installed by the Dockerfile AFTER
  # the sources are copied into /opt/dockflow - do not reference it here.
