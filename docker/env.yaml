name: dockflow
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - pip
  - numpy
  - pyyaml
  - requests
  # chemistry toolkits (heavy, not always pip-installable)
  - openbabel
  - pymol-open-source
  # docking engine (CLI executable)
  - autodock-vina
  # build deps for the vina python bindings and our C++ module
  - swig
  - cmake
  - ninja
  - pip:
      - -e /opt/dockflow[prep,viz]
